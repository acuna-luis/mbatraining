<title id="titulo">Exportaciones con un precio mundial superior al interno</title><desc id="descripcion">Sin comercio, la oferta y la demanda internas se cruzan en cincuenta toneladas diarias a cinco euros por kilo. La línea del precio mundial a siete euros corta la demanda en veinticinco toneladas y la oferta en setenta y cinco. Se exportan las cincuenta toneladas restantes.</desc>
