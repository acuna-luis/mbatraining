<title id="titulo">Ventaja comparativa aunque Ana produzca más de ambos bienes</title><desc id="descripcion">En una jornada, Ana puede producir ocho sacos de arroz o cuatro cestas de fruta. Bruno puede producir tres sacos o tres cestas. Las fronteras son rectas y una cesta cuesta dos sacos a Ana y uno a Bruno. Pueden intercambiarla por un saco y medio.</desc>
