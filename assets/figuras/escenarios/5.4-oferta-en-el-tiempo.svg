<title id="titulo">Oferta con agenda completa y con capacidad para crecer</title><desc id="descripcion">Desde una tarifa inicial de diez euros y cien citas semanales, ambas curvas pasan por el mismo punto. Al subir la tarifa a doce euros, la oferta de hoy sigue en cien citas. Tras ampliar el taller, la oferta alcanza ciento cuarenta citas a esa tarifa.</desc>
