 <title id="titulo">Cuando se contrae la oferta</title>
 <desc id="descripcion">Una curva de demanda descendente y dos de oferta ascendentes. La oferta nueva, discontinua, queda a la izquierda de la inicial. A igual precio los hornos ofrecen menos pan. El nuevo cruce con la demanda está más arriba y a la izquierda.</desc>
