<title id="titulo">El producto total aumenta mientras cae el aporte adicional</title><desc id="descripcion">Con uno, dos y tres trabajadores, el taller produce treinta, cincuenta y sesenta televisores al mes. El tramo oscuro de cada barra muestra cuánto añade la última persona contratada: treinta, veinte y diez televisores respectivamente.</desc>
