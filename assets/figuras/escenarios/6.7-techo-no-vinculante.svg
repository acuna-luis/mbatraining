 <title id="titulo">Un precio máximo que no limita las ventas</title>
 <desc id="descripcion">El techo legal es una línea horizontal por encima del cruce entre oferta y demanda. La franja de precios prohibidos está por encima del techo. El cruce queda en la zona permitida y allí se igualan las cantidades.</desc>
