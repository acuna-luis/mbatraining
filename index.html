<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#103e35" />
    <title>Fundamentos de Economía · MBA Training</title>
    <link rel="icon" href="assets/marca.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="aula.css" />
    <script defer src="data/curso.js"></script>
    <script defer src="data/referencias.js"></script>
    <script defer src="documento.js"></script>
    <script defer src="nube.js?v=2"></script>
    <script defer src="aula.js"></script>
  </head>
  <body>
    <section id="auth-screen" class="auth-screen" hidden aria-labelledby="auth-title">
      <div class="auth-card">
        <img src="assets/marca.svg" alt="MBA Training" width="44" height="44">
        <p class="eyebrow">Fundamentos de Economía</p>
        <h1 id="auth-title" class="auth-title">Iniciar sesión</h1>
        <p>Entra para continuar con tus respuestas guardadas.</p>
        <form id="auth-form">
          <label>Usuario<input id="auth-name" type="text" required autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="80"></label>
          <label>Contraseña<input id="auth-pass" type="password" required autocomplete="current-password"></label>
          <fieldset id="auth-initial" hidden><legend>Activa tu cuenta</legend>
            <label>Código de activación<input id="auth-token" type="password" autocomplete="off"></label>
            <label>Nueva contraseña (mínimo 12 caracteres)<input id="auth-new" type="password" autocomplete="new-password" minlength="12"></label>
          </fieldset>
          <button id="auth-submit" class="button" type="submit">Entrar</button>
        </form>
        <p id="auth-status" role="status" aria-live="polite"></p>
        <button id="auth-retry" class="quiet" type="button" hidden>Volver a conectar</button>
      </div>
    </section>
    <a class="skip" href="#main">Saltar al contenido</a>
    <aside id="sidebar" aria-label="Navegación del cuaderno">
      <div class="identity">
        <a href="#inicio"
          ><img src="assets/marca.svg" width="40" height="40" alt="" /><span
            >MBA Training<small>AULA DE ESTUDIO</small></span
          ></a
        ><button
          id="close-nav"
          class="icon-btn mobile"
          aria-label="Cerrar menú"
        >
          ×
        </button>
      </div>
      <nav id="navigation" aria-label="Curso"></nav>
      <div class="side-foot">
        <span data-icon="save"></span>
        <div>
          <strong id="account-user">Cuaderno personal</strong
          ><small id="account-save" role="status">Guardado en este navegador</small>
        </div>
      </div>
    </aside>
    <button id="shade" aria-label="Cerrar menú" hidden></button>
    <div class="shell">
      <header class="topbar">
        <button
          id="open-nav"
          class="icon-btn mobile"
          aria-label="Abrir menú"
          aria-controls="sidebar"
          aria-expanded="false"
          data-icon="menu"
        ></button>
        <div id="crumb"></div>
        <a
          class="quiet pdf-link"
          aria-label="Abrir compendio a color en PDF"
          href="assets/compendio-color.pdf"
          target="_blank"
          rel="noopener"
          ><span data-icon="book"></span
          ><span class="pdf-full">Compendio PDF</span
          ><span class="pdf-short">PDF</span></a
        >
        <div id="account-tools" hidden><button id="account-logout" type="button" class="quiet">Salir</button></div>
      </header>
      <div id="mobile-account" hidden></div>
      <div id="save-warning" role="alert" hidden></div>
      <main id="main" tabindex="-1"></main>
    </div>
    <dialog id="figure-dialog" aria-label="Gráfico ampliado">
      <button class="icon-btn close-dialog" aria-label="Cerrar gráfico">
        ×
      </button>
      <div class="zoom-area"><img alt="" /></div>
    </dialog>
    <div id="notice" role="status" aria-live="polite"></div>
    <noscript
      >Activa JavaScript para utilizar el cuaderno. También puedes
      <a href="assets/compendio-color.pdf">abrir el compendio a color</a
      >.</noscript
    >
  </body>
</html>
